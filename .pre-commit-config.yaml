# Pre-commit hooks for OpenCyber Harness.
#
# Revisions are pinned to full commit SHAs, resolved from their release tags on
# 2026-10-25. Dependabot's `pre-commit` ecosystem keeps them current; review any
# bump like a code change.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # v6.0.0
    hooks:
      - id: check-yaml
        args: ["--allow-multiple-documents"]
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files
        args: ["--maxkb=1024"]
      - id: check-merge-conflict
      - id: detect-private-key

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: f368fb366ff7f2f808dd324b83a6d32267799e19  # v0.17.2
    hooks:
      - id: ruff

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # v0.11.0.1
    hooks:
      - id: shellcheck
        args: ["-x", "--severity=warning"]

  - repo: local
    hooks:
      - id: generated-tool-docs
        name: generated tool documentation is current
        entry: env PYTHONPATH=src python3 scripts/generate-tool-docs.py --check
        language: system
        pass_filenames: false
        always_run: true
